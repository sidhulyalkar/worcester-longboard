name: validate
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  software:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python simulation/x1_dynamics.py
      - run: python -m pip install pytest trimesh numpy platformio cadquery
      - run: python -m pytest -q tests
      - name: Validate staged procurement authority
        run: python tools/validate_procurement_manifest.py hardware/procurement_manifest.json
      - name: Validate complete ordering spec
        run: python tools/validate_ordering_spec.py
      - name: Validate mechanical architecture
        run: python tools/validate_mechanical_architecture.py
      - name: Evaluate public build authority
        run: |
          python tools/evaluate_build_authority.py \
            hardware/build_authority.json \
            hardware/procurement_manifest.json \
            --out /tmp/x1-build-authority.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/x1-build-authority.json').read_text())
          assert report['capabilities']['order_fit_pilot_parts']['allowed'] is True
          assert report['capabilities']['order_measurement_chassis_parts']['allowed'] is True
          assert report['capabilities']['duplicate_four_fit_zones']['allowed'] is False
          assert report['capabilities']['fabricate_unpowered_chassis']['allowed'] is False
          assert report['capabilities']['qualify_brake_drive_topology']['allowed'] is False
          assert report['capabilities']['order_power_hardware']['allowed'] is False
          assert report['capabilities']['powered_operation']['allowed'] is False
          assert report['gates']['brake_drive_topology_qualified']['satisfied'] is False
          print('Public authority is conservative: evidence acquisition open; topology/physical/power gates remain closed.')
          PY
      - name: Host-test controller core
        run: |
          g++ -std=c++17 -O2 -Ifirmware/include \
            firmware/src/x1_control_core.cpp firmware/test/test_control_core.cpp \
            -o /tmp/x1_control_test
          /tmp/x1_control_test
      - name: Compile fit-rig ESP32-S3 logger at 10 SPS
        run: platformio run -d firmware/fit_rig_logger -e fit_rig_esp32s3_10sps
      - name: Compile fit-rig ESP32-S3 logger at 80 SPS
        run: platformio run -d firmware/fit_rig_logger -e fit_rig_esp32s3_80sps
      - name: Generate fit-rig CAD reference artifacts
        run: |
          python cad/generate_fit_rig.py
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('cad/generated_fit/fit_rig_authority.json')
          data = json.loads(p.read_text())
          assert data['validation_errors'] == []
          assert data['sensor_mount_pilot_ready'] is True
          assert data['sensor_mount_fabrication_ready'] is False
          assert len(data['measurement_gates']) == 3
          print('Fit-rig CAD generated: one-zone vendor-pattern pilot ready; four-pod duplication remains physically gated.')
          PY
      - name: Generate one-zone pilot CAD package
        run: |
          python cad/generate_one_zone_pilot.py
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('cad/generated_one_zone_pilot')
          authority = json.loads((root / 'one_zone_pilot_authority.json').read_text())
          cut_sheet = json.loads((root / 'one_zone_pilot_cut_sheet.json').read_text())
          assert authority['pilot_validation_errors'] == []
          assert authority['pilot_cad_ready'] is True
          assert authority['four_zone_duplication_ready'] is False
          assert len(authority['physical_gates']) == 5
          assert cut_sheet['scope'] == 'unpowered_one_zone_pilot_reference_only'
          assert cut_sheet['not_strength_certification'] is True
          assert cut_sheet['load_cell_reference']['physical_unit_verified'] is False
          required = {
              'x1_pilot_carrier_plate.step', 'x1_pilot_carrier_plate.stl',
              'x1_pilot_load_cell_pod.step', 'x1_pilot_load_cell_pod.stl',
              'x1_pilot_zone_pad.step', 'x1_pilot_zone_pad.stl',
              'x1_pilot_load_cell_reference.step', 'x1_pilot_load_cell_reference.stl',
              'x1_pilot_alignment_jig.step', 'x1_pilot_alignment_jig.stl',
              'one_zone_pilot_cut_sheet.json', 'one_zone_pilot_authority.json',
          }
          present = {p.name for p in root.iterdir() if p.is_file()}
          missing = sorted(required - present)
          assert not missing, f'missing pilot CAD outputs: {missing}'
          print('One-zone pilot CAD generated: bench package ready; physical Issue #4 qualification still required.')
          PY
      - name: Generate donor-grounded rolling-chassis references
        run: |
          python cad/generate_rolling_chassis.py
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('cad/generated_chassis')
          variants = (
              'brake_first_400mm',
              'drive_clearance_420mm',
              'brake_hanger_70mm_topology_study',
          )
          for variant in variants:
              authority = json.loads((root / f'x1_chassis_{variant}_authority.json').read_text())
              assert authority['schema_version'] == 2
              assert authority['validation_errors'] == []
              assert authority['scope'] == 'unpowered_rolling_chassis_geometry_only'
              assert authority['fabrication_ready'] is False
              assert authority['vendor_envelopes_verified'] is False
              assert authority['brake_interface_verified'] is False
              assert authority['motion_sweep_verified'] is False
              assert authority['geometry']['wheel']['diameter_mm'] == 194.0
              assert authority['geometry']['wheelbase_mm'] == 940.0
              for state in ('neutral', 'sweep'):
                  assert (root / f'x1_chassis_{variant}_{state}.step').stat().st_size > 0
                  assert (root / f'x1_chassis_{variant}_{state}.stl').stat().st_size > 0
          assert json.loads((root / 'x1_chassis_brake_first_400mm_authority.json').read_text())['reference_conflicts']['400mm_50mm_axle_brake_first']['brake_reference_compatible'] is True
          assert json.loads((root / 'x1_chassis_brake_hanger_70mm_topology_study_authority.json').read_text())['reference_conflicts']['300mm_hanger_70mm_axle_440mm_topology_study']['brake_reference_compatible'] == 'UNKNOWN_AFTER_AXLE_SWAP'
          print('Donor-grounded rolling chassis envelopes generated: three separate brake/drive topology references, none fabrication-ready.')
          PY
      - name: Upload fit-rig reference CAD
        uses: actions/upload-artifact@v7
        with:
          name: x1-fit-rig-v03-reference-${{ github.sha }}
          path: cad/generated_fit/
          if-no-files-found: error
          retention-days: 30
      - name: Upload one-zone pilot CAD
        uses: actions/upload-artifact@v7
        with:
          name: x1-one-zone-pilot-build-${{ github.sha }}
          path: cad/generated_one_zone_pilot/
          if-no-files-found: error
          retention-days: 30
      - name: Upload rolling-chassis reference CAD
        uses: actions/upload-artifact@v7
        with:
          name: x1-rolling-chassis-reference-${{ github.sha }}
          path: cad/generated_chassis/
          if-no-files-found: error
          retention-days: 30
