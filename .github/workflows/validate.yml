name: validate
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  software:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python simulation/x1_dynamics.py
      - name: Install pinned development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate Python environment contract
        run: |
          python -m pip check
          python tools/check_dev_environment.py --ci
          bash -n tools/bootstrap_dev_env.sh
          bash -n tools/validate_local_dev.sh
      - name: Compile Python sources
        run: python -m compileall -q tools cad fit simulation configurator
      - name: Parse browser modules
        run: |
          cp showcase/app.js /tmp/x1-showcase-app.mjs
          cp builder/app.js /tmp/x1-builder-app.mjs
          node --check /tmp/x1-showcase-app.mjs
          node --check /tmp/x1-builder-app.mjs
          node --check builder/engine.mjs
          node --check builder/platform_engine.mjs
          node --check builder/composer.mjs
          node --check builder/swap_engine.mjs
          node --check builder/visual_state.mjs
          node --check builder/preview_renderer.mjs
          node --check tools/generate_board_candidates.mjs
          node --check tools/build_board_visual_states.mjs
          node --check tools/render_board_candidate_previews.mjs
          node --check tools/evaluate_board_swap.mjs
      - name: Test browser Board Builder engines, composer and visuals
        run: node --test tests/js/test_board_builder_engine.mjs tests/js/test_board_catalog_composer.mjs tests/js/test_board_builder_swap_lab.mjs tests/js/test_board_builder_visuals.mjs
      - run: python -m pytest -q tests
      - name: Validate Board Builder catalog and authority boundary
        run: python tools/validate_board_builder.py
      - name: Audit multi-vendor catalog provenance and source health
        run: |
          python tools/audit_board_catalog.py \
            --as-of 2026-10-07 \
            --max-source-age-days 30 \
            --out /tmp/board-catalog-audit.json
          python tools/build_catalog_source_health.py \
            --as-of 2026-10-07 \
            --out /tmp/catalog-health.json \
            --worklist /tmp/catalog-refresh-worklist.md \
            --fail-on-integrity
          python - <<'PY'
          import json
          from pathlib import Path

          audit = json.loads(Path('/tmp/board-catalog-audit.json').read_text())
          assert audit['valid'] is True
          assert len(audit['coverage']['vendor_families']) >= 3
          assert len(audit['coverage']['steering_families']) >= 2
          assert len(audit['coverage']['drive_types']) >= 2
          assert all(value is False for value in audit['authority'].values())

          generated = json.loads(Path('/tmp/catalog-health.json').read_text())
          canonical = json.loads(Path('catalog/catalog_health.v1.json').read_text())
          dated = json.loads(Path('catalog/catalog_health_2026-10-07.json').read_text())
          assert generated == canonical == dated
          assert generated['valid'] is True
          assert generated['summary']['source_fresh'] == 15
          assert generated['summary']['refresh_due'] == 7
          assert generated['summary']['stale'] == 0
          assert generated['summary']['missing_provenance'] == 0
          assert generated['authority']['stock_currently_verified'] is False
          assert generated['authority']['procurement_authorized'] is False
          assert generated['authority']['fabrication_authorized'] is False
          assert generated['authority']['powered_operation_authorized'] is False

          worklist = Path('/tmp/catalog-refresh-worklist.md').read_text()
          assert '### MBS' in worklist
          assert 'mbs_matrixiii_2026_09_11' in worklist
          assert 'not stock confirmation' in worklist
          PY
      - name: Cross-check Python and browser Board Builder engines
        run: |
          env -u PYTHONPATH python tools/derive_board_requirements.py             configurator/examples/trail_rider_profile.json             --out /tmp/board-requirements.json
          env -u PYTHONPATH python tools/generate_board_candidates.py             configurator/examples/trail_rider_profile.json             --out /tmp/board-python.json
          node tools/generate_board_candidates.mjs             configurator/examples/trail_rider_profile.json             > /tmp/board-browser.json
          python tools/compare_board_builder_engines.py             /tmp/board-python.json             /tmp/board-browser.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/board-python.json').read_text())
          summary = data['composition_summary']
          assert summary['composer_enabled'] is True
          assert summary['synthesized_count'] > 0
          assert summary['synthesized_count'] <= summary['synthesized_candidate_cap']
          synth = [row for row in data['candidates'] if row.get('origin') == 'SYNTHESIZED']
          assert len(synth) == summary['synthesized_count']
          assert all(row['readiness'] in {'REFERENCE_COMPATIBLE', 'MEASURE_FIRST'} for row in synth)
          assert all(not row['blockers'] for row in synth)
          assert all(row['authority']['procurement_authorized'] is False for row in synth)
          assert all(row['authority']['fabrication_authorized'] is False for row in synth)
          assert all(row['authority']['powered_operation_authorized'] is False for row in synth)
          assert all(row['composition']['engine'] == 'catalog_composer_v1' for row in synth)
          PY
          env -u PYTHONPATH python tools/render_board_bom.py             configurator/examples/trail_rider_profile.json             --candidate x1_compact_electric_study             --out /tmp/board-bom.md
          grep -q "Source links are not checkout authorization" /tmp/board-bom.md
          grep -q "POWER_GATED" /tmp/board-bom.md
          env -u PYTHONPATH python tools/evaluate_board_swap.py             configurator/examples/trail_rider_profile.json             configurator/examples/swap_incompatible_study.json             --candidate x1_compact_electric_study             --out /tmp/board-swap-python.json
          node tools/evaluate_board_swap.mjs             configurator/examples/trail_rider_profile.json             configurator/examples/swap_incompatible_study.json             --candidate x1_compact_electric_study             > /tmp/board-swap-browser.json
          python tools/compare_board_swap_engines.py             /tmp/board-swap-python.json             /tmp/board-swap-browser.json
          env -u PYTHONPATH python tools/build_board_visual_states.py             configurator/examples/trail_rider_profile.json             --out /tmp/board-visual-python.json
          node tools/build_board_visual_states.mjs             configurator/examples/trail_rider_profile.json             > /tmp/board-visual-browser.json
          python tools/compare_board_visual_states.py             /tmp/board-visual-python.json             /tmp/board-visual-browser.json
          node tools/render_board_candidate_previews.mjs             configurator/examples/trail_rider_profile.json             --out-dir /tmp/board-previews
          test -f /tmp/board-previews/x1_compact_electric_study-hero.svg
          test -f /tmp/board-previews/x1_compact_electric_study-top.svg
          test -f /tmp/board-previews/x1_compact_electric_study-side.svg
          grep -q "VISUAL STUDY" /tmp/board-previews/x1_compact_electric_study-hero.svg
          grep -q '"visualization_only": true' /tmp/board-previews/manifest.json
      - name: Smoke-test local showcase without PYTHONPATH
        run: env -u PYTHONPATH python tools/prepare_x1_showcase.py --synthetic-snowdeck-demo
      - name: Validate staged procurement authority
        run: python tools/validate_procurement_manifest.py hardware/procurement_manifest.json
      - name: Validate complete ordering spec
        run: python tools/validate_ordering_spec.py
      - name: Validate mechanical architecture
        run: python tools/validate_mechanical_architecture.py
      - name: Evaluate public build authority
        run: |
          python tools/evaluate_build_authority.py \
            hardware/build_authority.json \
            hardware/procurement_manifest.json \
            --out /tmp/x1-build-authority.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/x1-build-authority.json').read_text())
          assert report['capabilities']['order_fit_pilot_parts']['allowed'] is True
          assert report['capabilities']['order_measurement_chassis_parts']['allowed'] is False
          assert report['gates']['rev_c_chassis_release_qualified']['satisfied'] is False
          assert report['capabilities']['duplicate_four_fit_zones']['allowed'] is False
          assert report['capabilities']['fabricate_unpowered_chassis']['allowed'] is False
          assert report['capabilities']['qualify_brake_drive_topology']['allowed'] is False
          assert report['capabilities']['define_power_packaging_candidate']['allowed'] is False
          assert report['capabilities']['build_inert_dummy_pack_fixture']['allowed'] is False
          assert report['capabilities']['qualify_dummy_pack_mount']['allowed'] is False
          assert report['capabilities']['order_power_hardware']['allowed'] is False
          assert report['capabilities']['powered_operation']['allowed'] is False
          assert report['capabilities']['public_operation']['allowed'] is False
          assert report['capabilities']['dog_accompanied_operation']['allowed'] is False
          assert report['capabilities']['qualify_inert_trail_armor']['allowed'] is False
          assert report['capabilities']['prepare_powered_bench_readiness']['allowed'] is False
          assert report['capabilities']['conduct_secured_unloaded_spin']['allowed'] is False
          assert report['capabilities']['conduct_restrained_loaded_bench']['allowed'] is False
          assert report['capabilities']['conduct_rider_free_controlled_ground']['allowed'] is False
          assert report['capabilities']['conduct_rider_only_very_low_speed_commissioning']['allowed'] is False
          assert report['gates']['commissioning_stage_0_qualified']['satisfied'] is False
          assert report['gates']['commissioning_stage_4_qualified']['satisfied'] is False
          assert report['gates']['brake_drive_topology_qualified']['satisfied'] is False
          assert report['gates']['power_packaging_candidate_defined']['satisfied'] is False
          assert report['gates']['dummy_pack_mount_qualified']['satisfied'] is False
          assert report['gates']['power_architecture_frozen']['satisfied'] is False
          assert report['gates']['lifecycle_health_ready']['satisfied'] is False
          print('Public authority is conservative: fit-pilot ordering open; Rev-C chassis, topology, packaging, dummy-pack and power gates remain closed.')
          PY
      - name: Smoke-test Issue 51 physical kickoff
        run: |
          python tools/init_x1_physical_kickoff.py /tmp/x1-physical-kickoff
          test -f /tmp/x1-physical-kickoff/DAY0_KICKOFF.md
          test -f /tmp/x1-physical-kickoff/NEXT_STEPS.md
          test -f /tmp/x1-physical-kickoff/owned_inventory.json
          test -f /tmp/x1-physical-kickoff/workspace_manifest.json
          test -f /tmp/x1-physical-kickoff/rev_c_release/deck_templates/rev_c_comp95_deck_envelope.svg
          test -f /tmp/x1-physical-kickoff/rev_c_release/deck_templates/rev_c_pro_warren_iii_deck_envelope.svg
          test -f /tmp/x1-physical-kickoff/rev_c_release/deck_templates/rev_c_agent_deck_envelope.svg
          python - <<'PY'
          import json
          from pathlib import Path

          packet = Path('/tmp/x1-physical-kickoff/DAY0_KICKOFF.md').read_text()
          assert '$120.90' in packet
          assert 'chassis/brake MEASURE_FIRST purchase: **BLOCKED**' in packet
          assert 'power ordering: **BLOCKED**' in packet
          assert 'powered operation: **BLOCKED**' in packet

          manifest = json.loads(
              Path('/tmp/x1-physical-kickoff/workspace_manifest.json').read_text()
          )
          assert manifest['scope'] == 'x1_physical_kickoff_workspace'
          assert manifest['procurement_authority'] is False
          assert manifest['fabrication_authority'] is False
          assert manifest['powered_operation_authority'] is False

          inventory_path = Path('/tmp/x1-physical-kickoff/owned_inventory.json')
          inventory = json.loads(inventory_path.read_text())
          mcu = next(x for x in inventory['items'] if x['id'] == 'MCU-ESP32S3')
          mcu.update({
              'status': 'OWNED_EQUIVALENT',
              'qty_owned_verified': 1,
              'unused_or_known_history': True,
          })
          inventory_path.write_text(json.dumps(inventory, indent=2) + '\n')
          PY
          python tools/render_physical_kickoff_packet.py             --inventory /tmp/x1-physical-kickoff/owned_inventory.json             --out /tmp/x1-physical-kickoff/DAY0_KICKOFF_UPDATED.md
          python - <<'PY'
          from pathlib import Path
          packet = Path('/tmp/x1-physical-kickoff/DAY0_KICKOFF_UPDATED.md').read_text()
          assert '$100.90' in packet
          assert 'VERIFY_OWNED_AND_SKIP_DUPLICATE' in packet
          assert '| DONOR-COMP95 | MEASURE_FIRST | BLOCKED |' in packet
          assert '| BATTERY-PRO-MODULAR | POWER_GATED | BLOCKED |' in packet
          PY
      - name: Smoke-test Issue 56 Cart A checkout and receiving
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          inventory_path = Path('/tmp/x1-physical-kickoff/owned_inventory.json')
          inventory = json.loads(inventory_path.read_text())
          inventory['inventory_checked_at_utc'] = '2026-10-02T12:00:00-07:00'
          for row in inventory['items']:
              row.update({
                  'status': 'NEED_BUY',
                  'qty_owned_verified': 0,
                  'exact_part_match': False,
                  'unused_or_known_history': False,
              })
          inventory_path.write_text(json.dumps(inventory, indent=2) + '\n')
          PY
          python tools/init_x1_cart_a_checkout.py \
            /tmp/x1-physical-kickoff/cart_a_checkout.json \
            --inventory /tmp/x1-physical-kickoff/owned_inventory.json \
            --checkout-id CI-CART-A
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('/tmp/x1-physical-kickoff/cart_a_checkout.json')
          checkout = json.loads(path.read_text())
          checkout['status'] = 'ORDERED'
          checkout['checkout_at_utc'] = '2026-10-02T12:30:00-07:00'
          for row in checkout['items']:
              if row['resolution'] != 'ORDER':
                  continue
              row['stock_confirmed_at_checkout'] = True
              if row['source_snapshot_required']:
                  row['source_rechecked_at_checkout'] = True
              if row['unit_price_usd'] is None:
                  row['unit_price_usd'] = 1.0
              row['order_confirmation_ref'] = 'ci-order-' + row['id']

          merchandise = sum(
              row['ordered_qty'] * float(row['unit_price_usd'])
              for row in checkout['items']
              if row['resolution'] == 'ORDER'
          )
          checkout['merchandise_total_usd'] = round(merchandise, 2)
          checkout['shipping_usd'] = 5.0
          checkout['tax_usd'] = 4.0
          checkout['order_total_usd'] = round(merchandise + 9.0, 2)
          path.write_text(json.dumps(checkout, indent=2) + '\n')
          PY
          python tools/validate_x1_cart_a_checkout.py \
            /tmp/x1-physical-kickoff/cart_a_checkout.json \
            --inventory /tmp/x1-physical-kickoff/owned_inventory.json \
            --out /tmp/x1-physical-kickoff/cart_a_checkout_authority.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path('/tmp/x1-physical-kickoff/cart_a_checkout_authority.json').read_text()
          )
          assert report['valid'] is True
          assert report['checkout_ready'] is True
          assert report['order_record_complete'] is True
          assert report['checkout_within_existing_buy_now_authority'] is True
          assert report['procurement_authority'] is False
          assert report['physical_qualification_authority'] is False
          assert report['powered_operation_authorized'] is False
          assert 'DONOR-COMP95' not in report['ordered_item_ids']
          assert 'BATTERY-PRO-MODULAR' not in report['ordered_item_ids']
          PY
          python tools/init_x1_cart_a_receiving.py \
            /tmp/x1-physical-kickoff/cart_a_receiving.json \
            --checkout /tmp/x1-physical-kickoff/cart_a_checkout.json \
            --checkout-authority /tmp/x1-physical-kickoff/cart_a_checkout_authority.json \
            --receiving-id CI-RECEIVE-A
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('/tmp/x1-physical-kickoff/cart_a_receiving.json')
          receiving = json.loads(path.read_text())
          receiving['status'] = 'COMPLETE'
          receiving['received_at_utc'] = '2026-10-03T12:00:00-07:00'

          def unit(hardware_id, role):
              return {
                  'hardware_id': hardware_id,
                  'role': role,
                  'exact_part_match': True,
                  'visible_damage_observed': False,
                  'packaging_and_markings_recorded': True,
                  'condition_note': 'CI synthetic clean receipt.',
              }

          for row in receiving['items']:
              row['qty_received'] = row['expected_qty']
              row['package_sku_observed'] = row['expected_sku']
              row['substitution_observed'] = False
              row['visible_damage_observed'] = False
              if row['id'] == 'LC-3135':
                  row['hardware_units'] = [
                      unit('LC-CI-A', 'PILOT_ACTIVE_CANDIDATE'),
                      unit('LC-CI-SPARE', 'SPARE_UNTOUCHED'),
                  ]
              elif row['id'] == 'ADC-HX711':
                  row['hardware_units'] = [
                      unit('ADC-CI-A', 'PILOT_ACTIVE_CANDIDATE'),
                      unit('ADC-CI-SPARE', 'SPARE_UNTOUCHED'),
                  ]
              elif row['id'] == 'MCU-ESP32S3':
                  row['hardware_units'] = [
                      unit('MCU-CI-A', 'PILOT_ACTIVE_CANDIDATE'),
                  ]

          path.write_text(json.dumps(receiving, indent=2) + '\n')
          PY
          python tools/validate_x1_cart_a_receiving.py \
            /tmp/x1-physical-kickoff/cart_a_receiving.json \
            --checkout /tmp/x1-physical-kickoff/cart_a_checkout.json \
            --checkout-authority /tmp/x1-physical-kickoff/cart_a_checkout_authority.json \
            --out /tmp/x1-physical-kickoff/cart_a_receiving_authority.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path('/tmp/x1-physical-kickoff/cart_a_receiving_authority.json').read_text()
          )
          assert report['valid'] is True
          assert report['receiving_complete'] is True
          assert report['issue4_materials_accounted_for'] is True
          assert report['physical_qualification_authority'] is False
          assert report['fabrication_authority'] is False
          assert report['powered_operation_authorized'] is False
          assert set(report['tracked_hardware_item_ids_ready']) == {
              'LC-3135',
              'ADC-HX711',
              'MCU-ESP32S3',
          }
          PY
      - name: Smoke-test Issues 59 and 61 fit-pilot provenance
        run: |
          python tools/init_x1_fit_pilot_hardware_selection.py \
            /tmp/x1-physical-kickoff/pilot_hardware_selection.json \
            --inventory /tmp/x1-physical-kickoff/owned_inventory.json \
            --checkout /tmp/x1-physical-kickoff/cart_a_checkout.json \
            --checkout-authority /tmp/x1-physical-kickoff/cart_a_checkout_authority.json \
            --receiving /tmp/x1-physical-kickoff/cart_a_receiving.json \
            --receiving-authority /tmp/x1-physical-kickoff/cart_a_receiving_authority.json \
            --selection-id CI-PILOT-HW \
            --selected-at-utc 2026-10-03T12:30:00-07:00 \
            --mcu-id MCU-CI-A
          python tools/validate_x1_fit_pilot_hardware_selection.py \
            /tmp/x1-physical-kickoff/pilot_hardware_selection.json \
            --inventory /tmp/x1-physical-kickoff/owned_inventory.json \
            --checkout /tmp/x1-physical-kickoff/cart_a_checkout.json \
            --checkout-authority /tmp/x1-physical-kickoff/cart_a_checkout_authority.json \
            --receiving /tmp/x1-physical-kickoff/cart_a_receiving.json \
            --receiving-authority /tmp/x1-physical-kickoff/cart_a_receiving_authority.json \
            --out /tmp/x1-physical-kickoff/pilot_hardware_selection_authority.json
          python tools/init_x1_fit_pilot_mass_reference.py \
            /tmp/x1-physical-kickoff/pilot_mass_reference.json \
            --reference-set-id CI-MASS-REF \
            --measured-at-utc 2026-10-03T12:45:00-07:00
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('/tmp/x1-physical-kickoff/pilot_mass_reference.json')
          data = json.loads(path.read_text())

          def ref_mass(mass_id, role, mass, uncertainty):
              return {
                  'mass_id': mass_id,
                  'role': role,
                  'evidence_type': 'REFERENCE_MASS',
                  'declared_mass_kg': mass,
                  'declared_uncertainty_kg': uncertainty,
                  'reference_mass_evidence': {
                      'source_reference': 'CI synthetic reference evidence',
                      'documented_mass_kg': mass,
                      'documented_uncertainty_kg': uncertainty,
                  },
                  'independent_scale_evidence': {
                      'scale_manufacturer': '',
                      'scale_model': '',
                      'capacity_kg': None,
                      'resolution_kg': None,
                      'stated_accuracy_source': '',
                      'conservative_accuracy_limit_kg': None,
                      'zero_check_before': True,
                      'zero_check_after': True,
                      'repeated_readings_kg': [],
                      'measurement_notes': '',
                  },
                  'notes': '',
              }

          data['masses'] = [
              ref_mass('CAL-1P997', 'CALIBRATION', 1.997, 0.002),
              ref_mass('CAL-5P013', 'CALIBRATION', 5.013, 0.005),
              ref_mass('CAL-10P021', 'CALIBRATION', 10.021, 0.010),
              ref_mass('VAL-7P486', 'VALIDATION', 7.486, 0.007),
          ]
          path.write_text(json.dumps(data, indent=2) + '\n')
          PY
          python tools/validate_x1_fit_pilot_mass_reference.py \
            /tmp/x1-physical-kickoff/pilot_mass_reference.json \
            --out /tmp/x1-physical-kickoff/pilot_mass_reference_authority.json
          python tools/init_one_zone_pilot_session.py \
            /tmp/x1-one-zone-session \
            --hardware-selection /tmp/x1-physical-kickoff/pilot_hardware_selection.json \
            --hardware-selection-authority /tmp/x1-physical-kickoff/pilot_hardware_selection_authority.json \
            --mass-reference /tmp/x1-physical-kickoff/pilot_mass_reference.json \
            --mass-reference-authority /tmp/x1-physical-kickoff/pilot_mass_reference_authority.json \
            --pod-id POD-CI-A \
            --zone-pad-id PAD-CI-A \
            --channel left_heel \
            --sps 10
          python - <<'PY'
          import json
          from pathlib import Path

          selection = json.loads(
              Path('/tmp/x1-physical-kickoff/pilot_hardware_selection_authority.json').read_text()
          )
          mass_ref = json.loads(
              Path('/tmp/x1-physical-kickoff/pilot_mass_reference_authority.json').read_text()
          )
          assert selection['valid'] is True
          assert selection['authority'] == 'x1_fit_pilot_hardware_selection'
          assert selection['exact_evidence_hardware_verified'] is True
          assert selection['untouched_spares_preserved'] is True
          assert selection['physical_qualification_authority'] is False
          assert selection['four_zone_duplication_authorized'] is False
          assert selection['powered_operation_authorized'] is False

          assert mass_ref['valid'] is True
          assert mass_ref['authority'] == 'x1_fit_pilot_mass_reference'
          assert len(mass_ref['calibration_masses']) == 3
          assert len(mass_ref['validation_masses']) == 1
          assert mass_ref['nist_traceable'] is False
          assert mass_ref['legal_metrology'] is False
          assert mass_ref['load_cell_performance_authority'] is False
          assert mass_ref['four_zone_duplication_authorized'] is False
          assert mass_ref['powered_operation_authorized'] is False

          manifest = json.loads(
              Path('/tmp/x1-one-zone-session/pilot_manifest.json').read_text()
          )
          assert manifest['hardware_ids']['load_cell_id'] == 'LC-CI-A'
          assert manifest['hardware_ids']['hx711_id'] == 'ADC-CI-A'
          assert manifest['hardware_ids']['mcu_id'] == 'MCU-CI-A'
          assert manifest['spare_hardware_ids']['load_cell_id'] == 'LC-CI-SPARE'
          assert manifest['spare_hardware_ids']['hx711_id'] == 'ADC-CI-SPARE'
          assert manifest['hardware_selection']['selection_id'] == 'CI-PILOT-HW'
          assert manifest['mass_reference']['reference_set_id'] == 'CI-MASS-REF'
          assert Path('/tmp/x1-one-zone-session/provenance/hardware_selection.json').is_file()
