name: validate
on:
  push:
  pull_request:

jobs:
  software:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python simulation/x1_dynamics.py
      - run: python -m pip install pytest trimesh numpy
      - run: python -m pytest -q tests
      - name: Host-test controller core
        run: |
          g++ -std=c++17 -O2 -Ifirmware/include \
            firmware/src/x1_control_core.cpp firmware/test/test_control_core.cpp \
            -o /tmp/x1_control_test
          /tmp/x1_control_test
